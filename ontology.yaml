# Онтология проекта «Типы тканей и экспрессия генов».

ontology: tissues
goal: >
  Граф отвечает на вопросы исследователя и агента: какая ткань определена для
  каждого зашифрованного типа, какими методами это сделано и в каком файле лежит результат.

competency_questions:
  - Какая ткань определена для зашифрованного типа 3?
  - Какими методами определяются типы ткани (метод, метрика, маркерные гены)?
  - В каком файле лежит итоговый график с результатом?

classes:
  Образец:
    parent: null
    definition: один образец (sample) RNA-seq, столбец таблицы каунтов
  Ген:
    parent: null
    definition: ген, строка таблицы каунтов
  ЗашифрованныйТип:
    parent: null
    definition: номер типа ткани от 1 до 5, под которым ткань скрыта в данных
  Ткань:
    parent: null
    definition: тип ткани человека (Skin, Lung, Brain, ...)
  НаборДанных:
    parent: null
    definition: таблица исходных данных проекта (каунты или метаданные)
  Метод:
    parent: null
    definition: способ обработки или классификации данных (нормализация, классификатор, отбор маркерных генов)
  Результат:
    parent: null
    definition: итог определения тканей, график или таблица с расшифровкой
  Источник:
    parent: null
    definition: статья или другой источник, на который опирается проект
  Задача:
    parent: null
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Файл:
    parent: null
    definition: файл проекта — таблица, код, текст; узел графа — сам файл

properties:
  входитВ: {domain: Образец, range: ЗашифрованныйТип}
  определёнКак: {domain: ЗашифрованныйТип, range: Ткань}
  полученМетодом: {domain: Результат, range: Метод}
  описанВ: {domain: Метод, range: Источник}
  хранитсяВ: {domain: [Результат, НаборДанных], range: Файл}
  подзадачаОт: {domain: Задача, range: Задача, characteristics: [транзитивное]}

attributes:
  status: {domain: Задача, values: [открыта, в работе, выполнена, заблокирована, принята]}

rules:
  - id: П1
    text: каждый зашифрованный тип определён как какая-либо ткань
    dl: "ЗашифрованныйТип ⊑ ∃определёнКак.Ткань"
    check: {kind: some, class: ЗашифрованныйТип, property: определёнКак, target: Ткань}
  - id: П2
    text: каждый результат получен каким-либо методом
    dl: "Результат ⊑ ∃полученМетодом.Метод"
    check: {kind: some, class: Результат, property: полученМетодом, target: Метод}
  - id: П3
    text: каждый результат хранится в файле проекта
    dl: "Результат ⊑ ∃хранитсяВ.Файл"
    check: {kind: some, class: Результат, property: хранитсяВ, target: Файл}
